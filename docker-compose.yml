# Local WordPress for trying the plugin.
# Start: docker compose up -d    then open http://localhost:8080
# Stop:  docker compose down     (add -v to also delete the database)

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      # The plugin and theme folders are shared with WordPress, so code changes show up on refresh.
      - ./coffee-shop:/var/www/html/wp-content/plugins/coffee-shop
      - ./coffee-shop-theme:/var/www/html/wp-content/themes/coffee-shop-theme

volumes:
  db_data:
